<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090E17"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filter for glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1.2" fill="#38BDF8" fill-opacity="0.25"/>
    </pattern>

    <style>
      @keyframes pulseRing {
        0% { r: 25px; opacity: 0.9; }
        50% { opacity: 0.4; }
        100% { r: 145px; opacity: 0; }
      }
      @keyframes pulseRing2 {
        0% { r: 25px; opacity: 0.7; }
        60% { opacity: 0.3; }
        100% { r: 190px; opacity: 0; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -80; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes beaconPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px #38BDF8); }
        50% { transform: scale(1.12); filter: drop-shadow(0 0 18px #818CF8); }
      }
      .ring-anim-1 {
        animation: pulseRing 3.5s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
        transform-origin: 1010px 190px;
      }
      .ring-anim-2 {
        animation: pulseRing2 4.5s cubic-bezier(0.2, 0.6, 0.4, 1) infinite 1.2s;
        transform-origin: 1010px 190px;
      }
      .stream-line {
        stroke-dasharray: 6 10;
        animation: dashFlow 2.8s linear infinite;
      }
      .signal-card-1 {
        animation: floatSlow1 5s ease-in-out infinite;
        transform-origin: center;
      }
      .signal-card-2 {
        animation: floatSlow2 6s ease-in-out infinite 0.7s;
        transform-origin: center;
      }
      .signal-card-3 {
        animation: floatSlow1 5.5s ease-in-out infinite 1.5s;
        transform-origin: center;
      }
      .center-beacon {
        animation: beaconPulse 2.8s ease-in-out infinite;
        transform-origin: 1010px 190px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Subtle ambient glow spots in background -->
  <circle cx="1010" cy="190" r="160" fill="#38BDF8" fill-opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="180" cy="90" r="140" fill="#818CF8" fill-opacity="0.07" filter="url(#softGlow)"/>
  <circle cx="650" cy="340" r="180" fill="#C084FC" fill-opacity="0.05" filter="url(#softGlow)"/>

  <!-- Radar Rings in Right Background -->
  <g opacity="0.8">
    <circle class="ring-anim-2" cx="1010" cy="190" r="25" fill="none" stroke="#818CF8" stroke-width="1.8"/>
    <circle class="ring-anim-1" cx="1010" cy="190" r="25" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="1010" cy="190" r="85" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="1010" cy="190" r="140" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- Connecting Animated Intent Flow Lines -->
  <path class="stream-line" d="M 740 100 L 880 100 L 980 170" fill="none" stroke="#38BDF8" stroke-width="1.6" opacity="0.65"/>
  <path class="stream-line" d="M 750 280 L 890 280 L 980 210" fill="none" stroke="#A855F7" stroke-width="1.6" opacity="0.65"/>
  <path class="stream-line" d="M 680 190 L 960 190" fill="none" stroke="#818CF8" stroke-width="1.8" opacity="0.75"/>

  <!-- Floating Dynamic Signal Cards (Placed on the right half, clear of title) -->
  <g class="signal-card-1">
    <g transform="translate(730, 68)">
      <rect width="215" height="42" rx="10" fill="url(#cardGrad1)" stroke="#38BDF8" stroke-width="1.2" filter="url(#glow)" opacity="0.95"/>
      <circle cx="20" cy="21" r="5" fill="#10B981"/>
      <text x="35" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">
        💼 Hiring: +42 Engineers
      </text>
    </g>
  </g>

  <g class="signal-card-2">
    <g transform="translate(780, 260)">
      <rect width="205" height="42" rx="10" fill="url(#cardGrad1)" stroke="#818CF8" stroke-width="1.2" filter="url(#glow)" opacity="0.95"/>
      <circle cx="20" cy="21" r="5" fill="#38BDF8"/>
      <text x="35" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">
        💰 Series B Raised ($32M)
      </text>
    </g>
  </g>

  <g class="signal-card-3">
    <g transform="translate(685, 168)">
      <rect width="210" height="42" rx="10" fill="url(#cardGrad1)" stroke="#C084FC" stroke-width="1.2" filter="url(#glow)" opacity="0.95"/>
      <circle cx="20" cy="21" r="5" fill="#F59E0B"/>
      <text x="35" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#E2E8F0">
        ⚡ Stack Added: Snowflake
      </text>
    </g>
  </g>

  <!-- Central Target Beacon -->
  <g class="center-beacon">
    <circle cx="1010" cy="190" r="20" fill="url(#beaconGrad)" filter="url(#glow)"/>
    <circle cx="1010" cy="190" r="8" fill="#FFFFFF"/>
  </g>
  <text x="1010" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1">
    INTENT BEACON
  </text>

  <!-- FOREGROUND: Clean, Unobstructed Title & Hierarchy (Left-Aligned, high contrast) -->
  <g transform="translate(70, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 68)">
      <rect width="265" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.8"/>
      <circle cx="16" cy="14" r="4.5" fill="#38BDF8"/>
      <text x="28" y="18.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#BAE6FD" letter-spacing="1">
        B2B REVENUE INTELLIGENCE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Awesome Intent-Driven
    </text>
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Outbound Sales Systems
    </text>

    <!-- Subtitle -->
    <text x="0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500" fill="#CBD5E1" letter-spacing="0.2">
      Signal Detection • Public Company Intelligence • Automated Outreach
    </text>

    <!-- Category Highlights Bar -->
    <g transform="translate(0, 278)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="138" height="30" rx="6" fill="#1E293B" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
      <text x="69" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#93C5FD">
        🏢 SaaS Platforms
      </text>

      <!-- Item 2 -->
      <rect x="148" y="0" width="144" height="30" rx="6" fill="#1E293B" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
      <text x="220" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#A5B4FC">
        💻 Open-Source
      </text>

      <!-- Item 3 -->
      <rect x="302" y="0" width="138" height="30" rx="6" fill="#1E293B" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
      <text x="371" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#F472B6">
        🤖 AI SDR Agents
      </text>

      <!-- Item 4 -->
      <rect x="450" y="0" width="158" height="30" rx="6" fill="#1E293B" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
      <text x="529" y="19" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6EE7B7">
        📊 Waterfall Enrich
      </text>
    </g>

    <!-- Bottom metadata line -->
    <text x="0" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#64748B">
      Curated ecosystem of SaaS tools, data providers &amp; open-source orchestration engines
    </text>
  </g>
</svg>
